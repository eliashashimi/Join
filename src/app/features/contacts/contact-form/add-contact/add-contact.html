<section class="contact">
  <div class="content-wrapper">
    <div class="contact__form">
      <img src="assets/images/Join-Logo-White.png" alt="Join Logo" />
      <h2>Add contact</h2>
      <p>Tasks are better with a team!</p>
      <img class="logo-underline" src="assets/icons/Vector 5.svg" alt="" />
    </div>
    <div class="contact__right">
      <button class="close-btn">X</button>
      <div class="contact__right--middle">
        <div class="person-name-img">
          <img src="assets/images/Group 13.png" alt="contact Icon" />
        </div>
        <div class="contact__right--input">
          <div class="contact__right--input--box">
            <div>
              <input class="name-edit inp" type="text" placeholder="Name" />
              <img class="inp-icon" src="assets/icons/person.svg" alt="Name Icon" />
            </div>
            <div>
              <input class="email-edit inp" type="text" placeholder="Email" />
              <img class="inp-icon" src="assets/icons/mail.svg" alt="Email-Icon" />
            </div>
            <div>
              <input class="number-edit inp" type="text" placeholder="Phone" />
              <img class="inp-icon" src="assets/icons/call.svg" alt="Phone Icon" />
            </div>
          </div>
          <div class="contact__right--btn">
            <button class="delete btn">
              Cancel <img src="assets/icons/cancel-icon.svg" alt="" />
            </button>
            <button class="save btn">
              Create contact <img src="assets/icons/check.svg" alt="okay icon" />
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
