<div class="priority" role="radiogroup" aria-label="Priority">
  @for (item of priorities; track item.value) {
    <button
      type="button"
      class="priority-btn"
      role="radio"
      [class]="item.value"
      [class.selected]="priority() === item.value"
      [attr.aria-checked]="priority() === item.value"
      (click)="select(item.value)"
    >
      {{ item.label }}
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        @switch (item.value) {
          @case ('urgent') {
            <path d="M6 11l6-6 6 6M6 18l6-6 6 6" />
          }
          @case ('medium') {
            <path d="M5 9h14M5 15h14" />
          }
          @case ('low') {
            <path d="M6 6l6 6 6-6M6 13l6 6 6-6" />
          }
        }
      </svg>
    </button>
  }
</div>
